# ============================================
# Application Info
# ============================================
spring.application.name=job-application-tracker

# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# MySQL Database Connection
# ============================================
# Update username/password to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/job_tracker?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
# "update" will auto-create/alter tables based on our entities during development.
# We still ship database/database.sql for anyone who wants to create the schema manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# CORS - allow the vanilla JS frontend (served separately) to call the API
# ============================================
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501

# ============================================
# Jackson - format dates as yyyy-MM-dd in JSON
# ============================================
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Security-related application configuration
server.error.include-message=never
server.error.include-stacktrace=never
