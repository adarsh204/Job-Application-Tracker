<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Job Application Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div class="app-shell">

    <!-- ============ Sidebar navigation ============ -->
    <aside class="sidebar">
      <div class="sidebar-brand profile-box">
        <label for="profilePhoto" class="profile-photo-label">
           <img id="profileImage" class="profile-image" src="assets/default-profile.png" alt="Profile Photo">
        </label>

       <input type="file" id="profilePhoto" accept="image/*" hidden>

      <input
        type="text"
        id="profileName"
        class="profile-name"
        placeholder="Your Name"
        maxlength="30"
       >
</div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-link active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Dashboard
        </a>
        <a href="applications.html" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 3h4v14H4V6h4l1-3z"/><path d="M9 12h6M9 16h6"/></svg>
          Applications
        </a>
        <a href="applications.html?openAdd=true" class="nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Add Application
        </a>
      </nav>
      <div class="sidebar-footer">
        Track every application in one place.
      </div>
    </aside>

    <!-- ============ Main content ============ -->
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Dashboard</h1>
          <p class="page-subtitle">A snapshot of your job search right now.</p>
        </div>
      </header>

      <div id="alertBox" class="alert-box" hidden></div>

      <!-- Stat tiles -->
      <section class="stats-grid" id="statsGrid" aria-label="Application statistics">
        <!-- Loading skeleton shown until JS populates real data -->
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
        <div class="stat-tile skeleton"><div class="stat-value">&nbsp;</div><div class="stat-label">Loading…</div></div>
      </section>

      <!-- Status breakdown chart -->
      <section class="panel">
        <h2 class="panel-title">Applications by status</h2>
        <div id="chartContainer" class="chart-container">
          <p class="empty-inline">Loading chart…</p>
        </div>
      </section>

      <!-- Recent applications preview -->
      <section class="panel">
        <div class="panel-header-row">
          <h2 class="panel-title">Recent applications</h2>
          <a href="applications.html" class="link-btn">View all →</a>
        </div>
        <div id="recentList" class="recent-list">
          <p class="empty-inline">Loading…</p>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
